[project]
name = "babushatnik-lite"
version = "0.1.0"
description = "Kufar rental listings scraper with Telegram delivery"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "celery>=5.6",
    "alembic>=1.14",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.31",
    "itsdangerous>=2.1",
    "aiogram>=3.13",
    "redis>=5.0",
    # Explicit transitive floors keep the lockfile above published security fixes.
    "click>=8.3.3",
    "idna>=3.15",
    "starlette>=1.3.1",
    "multidict>=6.9.1",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# A deliberately narrow, non-disruptive baseline: syntax/runtime errors,
# undefined names, unused imports and deterministic import ordering.
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["kufar_scraper", "admin", "bot", "background"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
