<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Babushatnik Lite Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
  </style>
</head>
<body>
<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card shadow-sm p-4" style="max-width: 380px; width: 100%;">
    <h4 class="mb-1 fw-bold text-center">🏠 Babushatnik Lite Admin</h4>
    <p class="text-muted text-center small mb-4">
      {% if telegram_auth_enabled %}
        Войдите через Telegram
      {% else %}
        Авторизация отключена
      {% endif %}
    </p>

    {% if error %}
    <div class="alert alert-danger small py-2">{{ error }}</div>
    {% endif %}

    {% if telegram_auth_enabled %}
    <div class="d-flex justify-content-center">
      <script async src="https://telegram.org/js/telegram-widget.js?22"
              data-telegram-login="babushatnik_finder_auth_bot"
              data-size="large"
              data-auth-url="{{ prefix }}/auth/telegram"
              data-request-access="write">
      </script>
    </div>
    {% else %}
    <div class="alert alert-info small py-2">
      Авторизация через Telegram отключена. Доступ открыт.
    </div>
    <a class="btn btn-primary w-100" href="{{ prefix }}/">Продолжить</a>
    {% endif %}
  </div>
</div>
</body>
</html>
