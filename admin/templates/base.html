<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Babushatnik Lite Admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
    .table th { white-space: nowrap; }
    .badge-enabled  { background-color: #198754; }
    .badge-disabled { background-color: #6c757d; }
    .pagination .page-link { color: #212529; }
    .pagination .active .page-link { background: #212529; border-color: #212529; color: #fff; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="{{ prefix }}/">🏠 Babushatnik Lite Admin</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link {% if request.url.path == prefix + '/' %}active fw-semibold{% endif %}" href="{{ prefix }}/">
        Listings
      </a>
      <a class="nav-link {% if request.url.path == prefix + '/cities' %}active fw-semibold{% endif %}" href="{{ prefix }}/cities">
        Cities
      </a>
      <a class="nav-link {% if request.url.path.startswith(prefix + '/tasks') or request.url.path == prefix + '/parser' %}active fw-semibold{% endif %}" href="{{ prefix }}/tasks">
        Tasks
      </a>
      <form method="post" action="{{ prefix }}/auth/logout" class="d-flex align-items-center ms-3">
        <button type="submit" class="btn btn-sm btn-outline-light">Выйти</button>
      </form>
    </div>
  </div>
</nav>
<div class="container-fluid px-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
